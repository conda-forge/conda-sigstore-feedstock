schema_version: 1

context:
  version: "0.1.5"

package:
  name: conda-sigstore
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/conda-sigstore/conda_sigstore-${{ version }}.tar.gz
  sha256: 0c0bc9cb0a75821f6b26cbb7f7fd6dfd0ced566fbe554fec180da9b589567016

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  files:
    exclude:
      - "**/direct_url.json"

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.12.2
    - hatch-vcs >=0.2.0
  run:
    - python >=${{ python_min }}
    - ca-certificates >=2026.10.19
    - certifi >=2026.10.19
    - conda >=26.5
    - conda-package-handling >=2
    - backports.zstd >=1.0.0
    - cryptography >=42
    - pyasn1 >=0.6,<0.7
    - rich >=13
    - sigstore >=4.5,<5

tests:
  - python:
      imports:
        - conda_sigstore
        - conda_sigstore.plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - conda sigstore --help
      - conda sigstore attest --help
      - conda sigstore verify --help
      - conda sigstore audit --help
      - conda --version

about:
  homepage: https://github.com/conda-incubator/conda-sigstore
  repository: https://github.com/conda-incubator/conda-sigstore
  documentation: https://conda-incubator.github.io/conda-sigstore
  summary: Create and verify Sigstore attestations for conda packages
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jezdez
